[project]
name = "jetlend"
version = "0.1.0"
description = "JetLend Django application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
    "django-environ>=0.12,<1.0",
    "djangorestframework>=3.18.1",
    "drf-spectacular>=0.28,<1.0",
    "gunicorn>=23.0,<24.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<6.0",
    "djangorestframework-stubs>=3.16,<4.0",
    "mypy>=1.18",
    "ruff>=0.13",
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
show_error_codes = true
show_error_context = true
pretty = true
exclude = [
    "^\\.venv/",
    "^promocodes/migrations/",
]

[tool.django-stubs]
django_settings_module = "config.settings.dev"
strict_settings = true

[[tool.mypy.overrides]]
module = ["environ", "environ.*"]
ignore_missing_imports = true

[tool.uv]
package = false
